{% extends "base.html" %}
{% block title %}Error {{ code }} - {{ site_title }}{% endblock %}
{% block content %}
<section class="error-card">
  <h1 class="page-title">
    {% if code == 404 %}
      Page not found
    {% else %}
      Something went wrong
    {% endif %}
  </h1>
  <p class="meta-line">{{ message }}</p>
  <div class="action-row">
    <a href="{{ url_for('routes.home') }}" class="btn btn-primary">Back to event</a>
  </div>
</section>
{% endblock %}
